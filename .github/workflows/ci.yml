# Validates every example skill and runs the unit tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Validate example skills
        run: python3 tools/validate_skill.py examples
      - name: Run unit tests
        run: python3 -m unittest discover tests -v
